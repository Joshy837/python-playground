<!DOCTYPE html>
<html lang="en" class="h-full" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Playground</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/src/ui/styles.css">
</head>
<body class="h-full flex flex-col overflow-hidden">
  <header class="app-header flex items-center justify-between px-4 py-2.5 border-b shrink-0">
    <div class="flex items-center gap-2">
      <img src="/favicon.svg" alt="" width="24" height="24" class="rounded-md">
      <span class="font-semibold">Python Playground</span>
    </div>
    <div class="flex items-center gap-3">
      <span id="pyodide-status" class="text-xs text-yellow-400">Loading Python runtime...</span>
      <select id="theme-select" class="theme-select">
        <option value="vs-dark">Dark</option>
        <option value="vs">Light</option>
        <option value="hc-black">High Contrast Dark</option>
        <option value="hc-light">High Contrast Light</option>
      </select>
      <button id="clear-btn" class="btn-secondary px-3 py-1.5 text-sm rounded cursor-pointer">
        Clear
      </button>
      <button
        id="run-btn"
        class="px-4 py-1.5 text-sm font-medium bg-green-600 hover:bg-green-500 disabled:opacity-40 disabled:cursor-not-allowed rounded transition-colors cursor-pointer"
        disabled
      >
        Run
      </button>
    </div>
  </header>

  <main class="flex flex-1 overflow-hidden">
    <div id="editor-container" class="flex-1 overflow-hidden"></div>
    <div class="app-divider w-px shrink-0"></div>
    <div class="output-panel flex flex-col w-2/5 overflow-hidden">
      <div class="output-label px-3 py-2 text-xs font-medium uppercase tracking-wider border-b shrink-0">
        Output
      </div>
      <div id="output" class="flex-1 overflow-auto p-4 font-mono text-sm"></div>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
