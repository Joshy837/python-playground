<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Playground</title>
  <link rel="stylesheet" href="/src/ui/styles.css">
</head>
<body class="h-full bg-gray-900 text-gray-100 flex flex-col overflow-hidden">
  <header class="flex items-center justify-between px-4 py-2.5 bg-gray-800 border-b border-gray-700 shrink-0">
    <span class="font-semibold text-white">Python Playground</span>
    <div class="flex items-center gap-3">
      <span id="pyodide-status" class="text-xs text-yellow-400">Loading Python runtime...</span>
      <button id="clear-btn" class="px-3 py-1.5 text-sm bg-gray-700 hover:bg-gray-600 rounded transition-colors cursor-pointer">
        Clear
      </button>
      <button
        id="run-btn"
        class="px-4 py-1.5 text-sm font-medium bg-green-600 hover:bg-green-500 disabled:opacity-40 disabled:cursor-not-allowed rounded transition-colors cursor-pointer"
        disabled
      >
        Run
      </button>
    </div>
  </header>

  <main class="flex flex-1 overflow-hidden">
    <div id="editor-container" class="flex-1 overflow-hidden"></div>
    <div class="w-px bg-gray-700 shrink-0"></div>
    <div class="flex flex-col w-2/5 bg-gray-950 overflow-hidden">
      <div class="px-3 py-2 text-xs font-medium text-gray-500 uppercase tracking-wider border-b border-gray-800 shrink-0">
        Output
      </div>
      <div id="output" class="flex-1 overflow-auto p-4 font-mono text-sm"></div>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
